<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Warm Bento Portfolio & Foam Link Hub</title>
    
    <!-- Google Fonts: Plus Jakarta Sans & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    },
                    colors: {
                        peach: {
                            50: '#fffbf7',
                            100: '#faf0e6',
                            200: '#f7e6dc',
                            300: '#f4d5c3',
                            400: '#eeb89e',
                            500: '#e06d53',
                            600: '#cb553c',
                            700: '#a7402b',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Blogger Full-Width Override CSS */
        #header-wrapper, #sidebar-wrapper, #footer-wrapper, .blog-feeds, .post-footer, .comments, #b-navbar, .navbar {
            display: none !important;
        }
        body, html {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            min-height: 100vh;
            background-color: #faf0e6 !important;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 10px 30px -5px rgba(180, 120, 100, 0.08);
            position: relative;
        }
        .glass-card:hover {
            box-shadow: 0 16px 35px -5px rgba(180, 120, 100, 0.14);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #faf0e6; }
        ::-webkit-scrollbar-thumb { background: #e4d1c6; border-radius: 99px; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#faf0e6] via-[#f7e6dc] to-[#f3dacb] text-[#3D2B27] font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // KONFIGURASI SAKLAR DEPLOYMENT
        const IS_PREVIEW = false; // Ubah ke false saat deploy ke Blogger dengan Apps Script backend
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwi4eYNDVWU0I2KAmP6xXiqDQmXpqxmJWtjwSHS4U6szf2iSdHFMaO1WpwLHvn8Myd5Iw/exec";

        const DEFAULT_CREDS = {
            username: "admin",
            password: "edudigital"
        };

        // INITIAL DATA DEFAULT DEEP EDITABLE
        const DEFAULT_PROFILE = {
            name: "Vivian Greene",
            role: "Senior UI/UX & Web Developer",
            greeting: "Good morning.",
            subgreeting: "Hari yang baru, mari buat karya yang bermakna ✨",
            quote: "生活不是等待风暴过去, 而是学会在雨中起舞。",
            quoteSub: "Life isn't about waiting for the storm to pass, it's about learning to dance in the rain.",
            author: "Vivian Greene",
            avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80",
            location: "Jakarta / 26°C",
            weather: "Cerah, Kelembapan 68%",
            availableForHire: true,
            statusTitle: "Available",
            statusBadge: "For Hire",
            statusDesc: "Menerima proyek desain UI/UX, pembuatan WebApp GAS, dan konsultasi.",
            email: "vivian.design@example.com",
            whatsapp: "6281234567890",
            audioTitle: "Design Better Podcast",
            audioEp: "EP97 · Antarmuka Hangat & Emotional UI",
            audioCoverTag: "Design",
            spotlightBadge: "🔥 Bio Links & Social Hub",
            spotlightTitle: "Temukan Semua Tautan & Layanan Saya Dalam Satu Tempat",
            spotlightDesc: "Jelajahi portofolio Behance, repository GitHub, artikel Medium, serta tautan booking konsultasi.",
            contactTitle: "Mari Berdiskusi ✉️",
            contactDesc: "Punya penawaran proyek, pertanyaan seputar desain, atau ingin menyapa? Kirimkan pesan di bawah ini."
        };

        const DEFAULT_FOAM_LINKS = [
            { id: 1, title: "Instagram Profile", category: "Social Media", icon: "instagram", url: "https://instagram.com", clicks: 428, description: "@vivian.design - Visual updates & daily creative process", isFeatured: true },
            { id: 2, title: "Behance Portfolio", category: "Design Showcase", icon: "figma", url: "https://behance.net", clicks: 610, description: "Full UI/UX Case studies, wireframes & prototype flows", isFeatured: true },
            { id: 3, title: "GitHub Repositories", category: "Code", icon: "github", url: "https://github.com", clicks: 312, description: "Open source web projects, React hooks & components", isFeatured: false },
            { id: 4, title: "Jadwalkan Konsultasi 1-on-1", category: "Services", icon: "calendar", url: "https://calendly.com", clicks: 154, description: "Diskusi proyek UI/UX, audit website, atau sesi mentoring", isFeatured: true },
            { id: 5, title: "LinkedIn Professional", category: "Social Media", icon: "linkedin", url: "https://linkedin.com", clicks: 275, description: "Pengalaman kerja profesional, lisensi & sertifikasi", isFeatured: false },
            { id: 6, title: "Spotify Focus Playlist", category: "Lifestyle", icon: "music", url: "https://spotify.com", clicks: 189, description: "Kumpulan musik ambient pilihan saat merancang desain", isFeatured: false }
        ];

        const DEFAULT_WORKS = [
            {
                id: 1,
                workType: "image",
                title: "From Minimalism to Emotional Design",
                subtitle: "界面正在回归真实体验 · UI/UX Case Study",
                category: "Visual Work",
                description: "Eksplorasi desain antarmuka modern yang menggabungkan prinsip neumorphism lembut dengan fungsionalitas produk harian.",
                fullContent: "Dalam studi kasus ini, kami mengeksplorasi bagaimana komponen antarmuka bento grid mampu mentransformasi pengalaman pengguna menjadi lebih intim dan menyenangkan...",
                image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80",
                tags: ["React", "Tailwind", "Figma"],
                demoUrl: "https://example.com"
            },
            {
                id: 2,
                workType: "text",
                title: "Panduan Merancang Bento Grid UI yang Intuitif",
                subtitle: "Esai & Catatan Desain Modern",
                category: "Artikel & Teks",
                description: "Analisis mendalam mengenai struktur bento box pada antarmuka web, hierarki visual, dan pembagian porsi informasi.",
                fullContent: "Bento Grid bukan sekadar tren visual, melainkan sebuah metode modularisasi informasi. Dengan membagi konten ke dalam modul-modul independen yang saling melengkapi, mata pengguna dapat memproses informasi secara acak tanpa kehilangan konteks utama...\n\nPrinsip Utama:\n1. Kontras visual melalui variasi ukuran grid (1x1, 2x1, 2x2).\n2. Penggunaan sudut membulat yang konsisten (24px - 32px).\n3. Sentuhan mikro-interaksi saat hover untuk memberikan respon intuitif.",
                image: "https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=800&q=80",
                tags: ["UI Design", "Article", "UX Writing"],
                demoUrl: ""
            }
        ];

        const DEFAULT_SKILLS = [
            { id: 1, name: "UI/UX & Prototyping", percentage: 92 },
            { id: 2, name: "Frontend (React / Tailwind)", percentage: 88 },
            { id: 3, name: "GAS & Web Automation", percentage: 82 }
        ];

        function App() {
            // State Utama
            const [activeTab, setActiveTab] = React.useState('home'); 
            const [adminCreds, setAdminCreds] = React.useState(() => {
                const saved = localStorage.getItem('bento_admin_creds');
                return saved ? JSON.parse(saved) : DEFAULT_CREDS;
            });
            const [profile, setProfile] = React.useState(() => {
                const saved = localStorage.getItem('bento_profile');
                return saved ? JSON.parse(saved) : DEFAULT_PROFILE;
            });
            const [foamLinks, setFoamLinks] = React.useState(() => {
                const saved = localStorage.getItem('bento_foam_links');
                return saved ? JSON.parse(saved) : DEFAULT_FOAM_LINKS;
            });
            const [works, setWorks] = React.useState(() => {
                const saved = localStorage.getItem('bento_works');
                return saved ? JSON.parse(saved) : DEFAULT_WORKS;
            });
            const [skills, setSkills] = React.useState(() => {
                const saved = localStorage.getItem('bento_skills');
                return saved ? JSON.parse(saved) : DEFAULT_SKILLS;
            });
            const [messages, setMessages] = React.useState([]);

            // UI Filter & Player States
            const [searchQuery, setSearchQuery] = React.useState('');
            const [selectedLinkCategory, setSelectedLinkCategory] = React.useState('All');
            const [selectedWorkFilter, setSelectedWorkFilter] = React.useState('all');
            const [isPlayingAudio, setIsPlayingAudio] = React.useState(false);
            const [toastMessage, setToastMessage] = React.useState('');

            // Modals States
            const [isAdminLoggedIn, setIsAdminLoggedIn] = React.useState(false);
            const [showLoginModal, setShowLoginModal] = React.useState(false);
            const [showChangeCredsModal, setShowChangeCredsModal] = React.useState(false);
            const [showProfileModal, setShowProfileModal] = React.useState(false);
            const [showStatusModal, setShowStatusModal] = React.useState(false);
            const [showQuoteModal, setShowQuoteModal] = React.useState(false);
            const [showAudioModal, setShowAudioModal] = React.useState(false);
            const [showSpotlightModal, setShowSpotlightModal] = React.useState(false);
            const [showSkillsModal, setShowSkillsModal] = React.useState(false);
            const [showContactEditModal, setShowContactEditModal] = React.useState(false);
            
            const [showLinkModal, setShowLinkModal] = React.useState(false);
            const [editingLink, setEditingLink] = React.useState(null);
            
            const [showWorkModal, setShowWorkModal] = React.useState(false);
            const [editingWork, setEditingWork] = React.useState(null);
            const [activeArticleModal, setActiveArticleModal] = React.useState(null);

            // Form Temp States
            const [loginForm, setLoginForm] = React.useState({ username: '', password: '' });
            const [credsForm, setCredsForm] = React.useState({ currentPassword: '', newUsername: '', newPassword: '' });
            const [profileForm, setProfileForm] = React.useState(profile);
            const [statusForm, setStatusForm] = React.useState({ availableForHire: profile.availableForHire, statusTitle: profile.statusTitle, statusBadge: profile.statusBadge, statusDesc: profile.statusDesc });
            const [quoteForm, setQuoteForm] = React.useState({ quote: profile.quote, quoteSub: profile.quoteSub, author: profile.author });
            const [audioForm, setAudioForm] = React.useState({ audioTitle: profile.audioTitle, audioEp: profile.audioEp, audioCoverTag: profile.audioCoverTag });
            const [spotlightForm, setSpotlightForm] = React.useState({ spotlightBadge: profile.spotlightBadge, spotlightTitle: profile.spotlightTitle, spotlightDesc: profile.spotlightDesc });
            const [skillsListForm, setSkillsListForm] = React.useState([...skills]);
            const [contactEditForm, setContactEditForm] = React.useState({ contactTitle: profile.contactTitle, contactDesc: profile.contactDesc });
            
            const [linkForm, setLinkForm] = React.useState({ title: '', category: 'Social Media', icon: 'link', url: '', description: '', isFeatured: false });
            const [workForm, setWorkForm] = React.useState({ workType: 'image', title: '', subtitle: '', category: 'Visual Work', description: '', fullContent: '', image: '', tags: '', demoUrl: '' });
            const [contactForm, setContactForm] = React.useState({ name: '', email: '', subject: '', message: '' });

            // Persistence LocalStorage
            React.useEffect(() => { localStorage.setItem('bento_admin_creds', JSON.stringify(adminCreds)); }, [adminCreds]);
            React.useEffect(() => { localStorage.setItem('bento_profile', JSON.stringify(profile)); }, [profile]);
            React.useEffect(() => { localStorage.setItem('bento_foam_links', JSON.stringify(foamLinks)); }, [foamLinks]);
            React.useEffect(() => { localStorage.setItem('bento_works', JSON.stringify(works)); }, [works]);
            React.useEffect(() => { localStorage.setItem('bento_skills', JSON.stringify(skills)); }, [skills]);

            // FETCH CLOUD DATA FROM GOOGLE SHEETS
            React.useEffect(() => {
                if (GAS_URL && GAS_URL !== "URL_DEPLOY_GAS_ANDA_DISINI") {
                    fetch(GAS_URL + "?action=getAllData")
                        .then(res => res.json())
                        .then(resData => {
                            if (resData && resData.status === "success") {
                                if (resData.data.credentials) setAdminCreds(resData.data.credentials);
                                if (resData.data.profile) setProfile(resData.data.profile);
                                if (resData.data.foamLinks && resData.data.foamLinks.length > 0) setFoamLinks(resData.data.foamLinks);
                                if (resData.data.works && resData.data.works.length > 0) setWorks(resData.data.works);
                                if (resData.data.skills && resData.data.skills.length > 0) setSkills(resData.data.skills);
                                showToast("☁️ Data disinkronkan dari Google Sheets Cloud!");
                            }
                        })
                        .catch(err => console.log("Cloud Fetch Error:", err));
                }
            }, []);

            // HELPER SINKRONISASI GAS
            const syncToGas = (action, payload) => {
                if (!GAS_URL || GAS_URL === "URL_DEPLOY_GAS_ANDA_DISINI") return;
                try {
                    fetch(GAS_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "text/plain" },
                        body: JSON.stringify({ action: action, data: payload, id: payload ? payload.id : null })
                    }).catch(err => console.log("Sync Error:", err));
                } catch(e) {
                    console.log("GAS Sync Failed", e);
                }
            };

            // Lucide Icon Sync
            React.useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [activeTab, foamLinks, works, skills, profile, isAdminLoggedIn, selectedLinkCategory, selectedWorkFilter]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            // HELPER SANITASI URL TARGET
            const formatUrl = (url) => {
                if (!url) return '#';
                let cleanUrl = url.trim();
                if (!/^https?:\/\//i.test(cleanUrl)) {
                    cleanUrl = 'https://' + cleanUrl;
                }
                return cleanUrl;
            };

            // HANDLERS EDIT SEKSIONAL
            const handleSaveProfile = (e) => {
                e.preventDefault();
                const updated = { ...profile, ...profileForm };
                setProfile(updated);
                syncToGas('saveProfile', updated);
                setShowProfileModal(false);
                showToast('👤 Profil Utama Berhasil Diperbarui!');
            };

            const handleSaveStatus = (e) => {
                e.preventDefault();
                const updated = { ...profile, ...statusForm };
                setProfile(updated);
                syncToGas('saveProfile', updated);
                setShowStatusModal(false);
                showToast('✨ Status Proyek Diperbarui!');
            };

            const handleSaveQuote = (e) => {
                e.preventDefault();
                const updated = { ...profile, ...quoteForm };
                setProfile(updated);
                syncToGas('saveProfile', updated);
                setShowQuoteModal(false);
                showToast('💬 Quote Diperbarui!');
            };

            const handleSaveAudio = (e) => {
                e.preventDefault();
                const updated = { ...profile, ...audioForm };
                setProfile(updated);
                syncToGas('saveProfile', updated);
                setShowAudioModal(false);
                showToast('🎙️ Audio Podcast Diperbarui!');
            };

            const handleSaveSpotlight = (e) => {
                e.preventDefault();
                const updated = { ...profile, ...spotlightForm };
                setProfile(updated);
                syncToGas('saveProfile', updated);
                setShowSpotlightModal(false);
                showToast('🔥 Spotlight Banner Diperbarui!');
            };

            const handleSaveSkills = (e) => {
                e.preventDefault();
                setSkills(skillsListForm);
                syncToGas('saveSkills', skillsListForm);
                setShowSkillsModal(false);
                showToast('📊 Skills Diperbarui!');
            };

            const handleAddSkillItem = () => {
                setSkillsListForm([...skillsListForm, { id: Date.now(), name: "Skill Baru", percentage: 80 }]);
            };

            const handleRemoveSkillItem = (id) => {
                setSkillsListForm(skillsListForm.filter(s => s.id !== id));
            };

            const handleSaveContactEdit = (e) => {
                e.preventDefault();
                const updated = { ...profile, ...contactEditForm };
                setProfile(updated);
                syncToGas('saveProfile', updated);
                setShowContactEditModal(false);
                showToast('✉️ Teks Kontak Diperbarui!');
            };

            // HANDLERS FOAM LINK & WORKS
            const handleLinkClick = (id, url) => {
                if (!url) return;
                const targetUrl = formatUrl(url);
                setFoamLinks(prev => prev.map(item => item.id === id ? { ...item, clicks: (item.clicks || 0) + 1 } : item));
                window.open(targetUrl, '_blank', 'noopener,noreferrer');
            };

            const handleCopyLink = (e, url) => {
                e.stopPropagation();
                if (!url) return;
                const targetUrl = formatUrl(url);
                navigator.clipboard.writeText(targetUrl);
                showToast('📋 Tautan berhasil disalin!');
            };

            const handleSaveLink = (e) => {
                e.preventDefault();
                let targetLink = null;
                if (editingLink) {
                    targetLink = { ...linkForm, id: editingLink.id, clicks: editingLink.clicks };
                    setFoamLinks(foamLinks.map(item => item.id === editingLink.id ? targetLink : item));
                    showToast('✅ Foam Link diperbarui!');
                } else {
                    targetLink = { ...linkForm, id: Date.now(), clicks: 0 };
                    setFoamLinks([targetLink, ...foamLinks]);
                    showToast('✨ Foam Link baru ditambahkan!');
                }
                syncToGas('saveLink', targetLink);
                setShowLinkModal(false);
                setEditingLink(null);
            };

            const handleDeleteLink = (id) => {
                setFoamLinks(foamLinks.filter(item => item.id !== id));
                syncToGas('deleteLink', { id: id });
                showToast('🗑️ Foam Link telah dihapus.');
            };

            const handleSaveWork = (e) => {
                e.preventDefault();
                const processedTags = typeof workForm.tags === 'string' ? workForm.tags.split(',').map(t => t.trim()) : workForm.tags;
                let targetWork = null;
                if (editingWork) {
                    targetWork = { ...workForm, tags: processedTags, id: editingWork.id };
                    setWorks(works.map(item => item.id === editingWork.id ? targetWork : item));
                    showToast('✅ Karya diperbarui!');
                } else {
                    targetWork = { ...workForm, tags: processedTags, id: Date.now() };
                    setWorks([targetWork, ...works]);
                    showToast('🎨 Karya baru ditambahkan!');
                }
                syncToGas('saveWork', targetWork);
                setShowWorkModal(false);
                setEditingWork(null);
            };

            const handleDeleteWork = (id) => {
                setWorks(works.filter(item => item.id !== id));
                syncToGas('deleteWork', { id: id });
                showToast('🗑️ Karya telah dihapus.');
            };

            const handleLoginSubmit = (e) => {
                e.preventDefault();
                if (loginForm.username === adminCreds.username && loginForm.password === adminCreds.password) {
                    setIsAdminLoggedIn(true);
                    setShowLoginModal(false);
                    setLoginForm({ username: '', password: '' });
                    showToast('🔓 Login Admin Berhasil!');
                } else {
                    showToast('❌ Username atau Password Salah!');
                }
            };

            const handleChangeCredsSubmit = (e) => {
                e.preventDefault();
                if (credsForm.currentPassword !== adminCreds.password) {
                    showToast('❌ Password saat ini tidak cocok!');
                    return;
                }
                const updated = {
                    username: credsForm.newUsername || adminCreds.username,
                    password: credsForm.newPassword || adminCreds.password
                };
                setAdminCreds(updated);
                syncToGas('saveCredentials', updated);
                setShowChangeCredsModal(false);
                setCredsForm({ currentPassword: '', newUsername: '', newPassword: '' });
                showToast('🔐 Kredensial Admin Diperbarui!');
            };

            const handleContactSubmit = (e) => {
                e.preventDefault();
                const newMsg = { id: Date.now(), ...contactForm, date: new Date().toISOString().split('T')[0] };
                setMessages([newMsg, ...messages]);
                syncToGas('sendMessage', newMsg);
                setContactForm({ name: '', email: '', subject: '', message: '' });
                showToast('📬 Pesan Anda berhasil terkirim!');
            };

            // Filter Process
            const filteredLinks = foamLinks.filter(l => {
                const matchSearch = l.title.toLowerCase().includes(searchQuery.toLowerCase()) || l.description.toLowerCase().includes(searchQuery.toLowerCase());
                const matchCat = selectedLinkCategory === 'All' || l.category === selectedLinkCategory;
                return matchSearch && matchCat;
            });

            const filteredWorks = works.filter(w => {
                if (selectedWorkFilter === 'all') return true;
                return w.workType === selectedWorkFilter;
            });

            return (
                <div className="flex min-h-screen relative p-3 sm:p-5 md:p-8 gap-4 md:gap-6 max-w-7xl mx-auto">
                    
                    {/* TOAST NOTIFICATION */}
                    {toastMessage && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 sm:left-auto sm:right-5 sm:translate-x-0 z-50 bg-[#3D2B27] text-white text-xs font-semibold px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2 animate-bounce max-w-[90vw] text-center justify-center">
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* FLOATING SIDEBAR NAVIGATION (DESKTOP) */}
                    <aside className="fixed left-3 top-1/2 -translate-y-1/2 z-40 hidden md:flex flex-col items-center gap-4 py-6 px-3 bg-white/80 backdrop-blur-xl border border-white/80 rounded-full shadow-lg text-[#8C7A76]">
                        <div className="w-10 h-10 rounded-full overflow-hidden border-2 border-peach-400 cursor-pointer shadow-sm hover:scale-105 transition-transform" onClick={() => setActiveTab('home')}>
                            <img src={profile.avatar} alt="Avatar" className="w-full h-full object-cover" />
                        </div>
                        <div className="w-8 h-[1px] bg-peach-200 my-0.5"></div>
                        <button onClick={() => setActiveTab('home')} className={`p-3 rounded-full transition-all ${activeTab === 'home' ? 'bg-peach-500 text-white shadow-md' : 'hover:bg-peach-100'}`} title="Dashboard Home">
                            <i data-lucide="layout-grid" className="w-5 h-5"></i>
                        </button>
                        <button onClick={() => setActiveTab('foam-links')} className={`p-3 rounded-full transition-all relative ${activeTab === 'foam-links' ? 'bg-peach-500 text-white shadow-md' : 'hover:bg-peach-100'}`} title="Foam Links Hub">
                            <i data-lucide="link-2" className="w-5 h-5"></i>
                            <span className="absolute top-1 right-1 w-2.5 h-2.5 bg-peach-500 border-2 border-white rounded-full"></span>
                        </button>
                        <button onClick={() => setActiveTab('works')} className={`p-3 rounded-full transition-all ${activeTab === 'works' ? 'bg-peach-500 text-white shadow-md' : 'hover:bg-peach-100'}`} title="Hasil Karya (Gambar & Teks)">
                            <i data-lucide="folder-git-2" className="w-5 h-5"></i>
                        </button>
                        <button onClick={() => setActiveTab('contact')} className={`p-3 rounded-full transition-all ${activeTab === 'contact' ? 'bg-peach-500 text-white shadow-md' : 'hover:bg-peach-100'}`} title="Kontak / Pesan">

                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Sub-Deskripsi Banner</label>
                                        <textarea rows="2" value={spotlightForm.spotlightDesc} onChange={(e) => setSpotlightForm({ ...spotlightForm, spotlightDesc: e.target.value })} className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs"></textarea>
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setShowSpotlightModal(false)} className="w-1/2 py-2.5 bg-stone-200 hover:bg-stone-300 text-[#3D2B27] font-bold text-xs rounded-xl transition-colors">
                                            Batal
                                        </button>
                                        <button type="submit" className="w-1/2 py-2.5 bg-peach-500 hover:bg-peach-600 text-white font-bold text-xs rounded-xl shadow-md transition-all">
                                            Simpan Banner
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL EDIT FOAM LINK */}
                    {showLinkModal && (
                        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 cursor-pointer" onClick={() => setShowLinkModal(false)}>
                            <div className="glass-card p-5 sm:p-6 rounded-2xl sm:rounded-3xl w-[94vw] sm:w-full max-w-md bg-white space-y-4 max-h-[90vh] overflow-y-auto cursor-default" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-center">
                                    <h3 className="font-serif font-bold text-lg sm:text-xl text-[#3D2B27]">{editingLink ? "Edit Foam Link" : "Tambah Foam Link Baru"}</h3>
                                    <button onClick={() => setShowLinkModal(false)}><i data-lucide="x" className="w-5 h-5 text-[#8C7A76]"></i></button>
                                </div>
                                <form onSubmit={handleSaveLink} className="space-y-3">
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Judul Tautan (misal: Instagram Profile)</label>
                                        <input type="text" required value={linkForm.title} onChange={(e) => setLinkForm({ ...linkForm, title: e.target.value })} className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Kategori</label>
                                        <select value={linkForm.category} onChange={(e) => setLinkForm({ ...linkForm, category: e.target.value })} className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs">
                                            <option value="Social Media">Social Media</option>
                                            <option value="Design Showcase">Design Showcase</option>
                                            <option value="Code">Code</option>
                                            <option value="Services">Services</option>
                                            <option value="Lifestyle">Lifestyle</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">URL Tautan Target</label>
                                        <input type="text" required value={linkForm.url} onChange={(e) => setLinkForm({ ...linkForm, url: e.target.value })} placeholder="instagram.com/username atau https://..." className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Icon (Lucide Name: instagram, github, figma, calendar, music, dll)</label>
                                        <input type="text" value={linkForm.icon} onChange={(e) => setLinkForm({ ...linkForm, icon: e.target.value })} className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Deskripsi Ringkas</label>
                                        <textarea rows="2" value={linkForm.description} onChange={(e) => setLinkForm({ ...linkForm, description: e.target.value })} className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs"></textarea>
                                    </div>
                                    <div className="flex items-center gap-2 pt-1">
                                        <input type="checkbox" id="featuredCheck" checked={linkForm.isFeatured} onChange={(e) => setLinkForm({ ...linkForm, isFeatured: e.target.checked })} />
                                        <label htmlFor="featuredCheck" className="text-xs font-semibold text-[#3D2B27]">Tampilkan Badge POPULAR</label>
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setShowLinkModal(false)} className="w-1/2 py-2.5 bg-stone-200 hover:bg-stone-300 text-[#3D2B27] font-bold text-xs rounded-xl transition-colors">
                                            Batal
                                        </button>
                                        <button type="submit" className="w-1/2 py-2.5 bg-peach-500 hover:bg-peach-600 text-white font-bold text-xs rounded-xl shadow-md transition-all">
                                            Simpan Tautan
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL EDIT WORK */}
                    {showWorkModal && (
                        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 cursor-pointer" onClick={() => setShowWorkModal(false)}>
                            <div className="glass-card p-5 sm:p-6 rounded-2xl sm:rounded-3xl w-[94vw] sm:w-full max-w-lg bg-white space-y-4 max-h-[90vh] overflow-y-auto cursor-default" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-center">
                                    <h3 className="font-serif font-bold text-lg sm:text-xl text-[#3D2B27]">{editingWork ? "Edit Hasil Karya" : "Tambah Hasil Karya"}</h3>
                                    <button onClick={() => setShowWorkModal(false)}><i data-lucide="x" className="w-5 h-5 text-[#8C7A76]"></i></button>
                                </div>
                                <form onSubmit={handleSaveWork} className="space-y-3">
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Tipe Karya</label>
                                        <select value={workForm.workType} onChange={(e) => setWorkForm({ ...workForm, workType: e.target.value })} className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs">
                                            <option value="image">🖼️ Visual & Gambar (Design/Mockup)</option>
                                            <option value="text">📝 Artikel & Teks (Essay/Case Study)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Judul Karya</label>
                                        <input type="text" required value={workForm.title} onChange={(e) => setWorkForm({ ...workForm, title: e.target.value })} className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Sub-judul / Tagline</label>
                                        <input type="text" value={workForm.subtitle} onChange={(e) => setWorkForm({ ...workForm, subtitle: e.target.value })} className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">URL Gambar Header</label>
                                        <input type="text" value={workForm.image} onChange={(e) => setWorkForm({ ...workForm, image: e.target.value })} placeholder="https://..." className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Ringkasan Singkat (Card Description)</label>
                                        <textarea rows="2" value={workForm.description} onChange={(e) => setWorkForm({ ...workForm, description: e.target.value })} className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs"></textarea>
                                    </div>
                                    {workForm.workType === 'text' ? (
                                        <div>
                                            <label className="text-xs font-bold text-[#3D2B27] block mb-1">Naskah Artikel Utuh</label>
                                            <textarea rows="5" value={workForm.fullContent} onChange={(e) => setWorkForm({ ...workForm, fullContent: e.target.value })} placeholder="Tuliskan isi artikel lengkap di sini..." className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs"></textarea>
                                        </div>
                                    ) : (
                                        <div>
                                            <label className="text-xs font-bold text-[#3D2B27] block mb-1">URL Demo / Behance Target</label>
                                            <input type="text" value={workForm.demoUrl} onChange={(e) => setWorkForm({ ...workForm, demoUrl: e.target.value })} placeholder="https://..." className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                        </div>
                                    )}
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Tags (Pisahkan dengan koma: React, Figma, UI)</label>
                                        <input type="text" value={workForm.tags} onChange={(e) => setWorkForm({ ...workForm, tags: e.target.value })} className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setShowWorkModal(false)} className="w-1/2 py-2.5 bg-stone-200 hover:bg-stone-300 text-[#3D2B27] font-bold text-xs rounded-xl transition-colors">
                                            Batal
                                        </button>
                                        <button type="submit" className="w-1/2 py-2.5 bg-peach-500 hover:bg-peach-600 text-white font-bold text-xs rounded-xl shadow-md transition-all">
                                            Simpan Karya
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL EDIT KONTAK */}
                    {showContactEditModal && (
                        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 cursor-pointer" onClick={() => setShowContactEditModal(false)}>
                            <div className="glass-card p-5 sm:p-6 rounded-2xl sm:rounded-3xl w-[94vw] sm:w-full max-w-md bg-white space-y-4 cursor-default" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-center">
                                    <h3 className="font-serif font-bold text-lg sm:text-xl text-[#3D2B27]">Edit Teks Kontak</h3>
                                    <button onClick={() => setShowContactEditModal(false)}><i data-lucide="x" className="w-5 h-5 text-[#8C7A76]"></i></button>
                                </div>
                                <form onSubmit={handleSaveContactEdit} className="space-y-3">
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Judul Kontak</label>
                                        <input type="text" value={contactEditForm.contactTitle} onChange={(e) => setContactEditForm({ ...contactEditForm, contactTitle: e.target.value })} className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Deskripsi Kontak</label>
                                        <textarea rows="3" value={contactEditForm.contactDesc} onChange={(e) => setContactEditForm({ ...contactEditForm, contactDesc: e.target.value })} className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs"></textarea>
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setShowContactEditModal(false)} className="w-1/2 py-2.5 bg-stone-200 hover:bg-stone-300 text-[#3D2B27] font-bold text-xs rounded-xl transition-colors">
                                            Batal
                                        </button>
                                        <button type="submit" className="w-1/2 py-2.5 bg-peach-500 hover:bg-peach-600 text-white font-bold text-xs rounded-xl shadow-md transition-all">
                                            Simpan Teks Kontak
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL BACA ARTIKEL TEKS UTUH */}
                    {activeArticleModal && (
                        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 cursor-pointer" onClick={() => setActiveArticleModal(null)}>
                            <div className="glass-card p-6 rounded-3xl w-[94vw] sm:w-full max-w-2xl bg-white space-y-4 max-h-[85vh] overflow-y-auto cursor-default" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-start">
                                    <div>
                                        <span className="text-[10px] font-bold bg-peach-100 text-peach-700 px-3 py-1 rounded-full uppercase">
                                            {activeArticleModal.category}
                                        </span>
                                        <h2 className="font-serif font-bold text-2xl text-[#3D2B27] mt-2">{activeArticleModal.title}</h2>
                                        <p className="text-xs text-[#8C7A76] italic">{activeArticleModal.subtitle}</p>
                                    </div>
                                    <button onClick={() => setActiveArticleModal(null)} className="p-2 text-[#8C7A76] hover:bg-peach-100 rounded-full">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>
                                <div className="border-t border-peach-100 pt-4 text-xs sm:text-sm text-[#3D2B27] leading-relaxed whitespace-pre-line space-y-3">
                                    {activeArticleModal.fullContent || activeArticleModal.description}
                                </div>
                                <div className="pt-4 border-t border-peach-100 flex justify-end">
                                    <button onClick={() => setActiveArticleModal(null)} className="px-5 py-2 bg-peach-500 text-white font-bold text-xs rounded-xl hover:bg-peach-600">
                                        Tutup Artikel
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL EDIT CREDENTIALS ADMIN */}
                    {showChangeCredsModal && (
                        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 cursor-pointer" onClick={() => setShowChangeCredsModal(false)}>
                            <div className="glass-card p-5 sm:p-6 rounded-2xl sm:rounded-3xl w-[94vw] sm:w-full max-w-md bg-white space-y-4 cursor-default" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-center">
                                    <h3 className="font-serif font-bold text-lg sm:text-xl text-[#3D2B27]">Ubah Username & Password Admin</h3>
                                    <button onClick={() => setShowChangeCredsModal(false)}><i data-lucide="x" className="w-5 h-5 text-[#8C7A76]"></i></button>
                                </div>
                                <form onSubmit={handleChangeCredsSubmit} className="space-y-3">
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Password Saat Ini (Verifikasi)</label>
                                        <input type="password" required value={credsForm.currentPassword} onChange={(e) => setCredsForm({ ...credsForm, currentPassword: e.target.value })} placeholder="Password sekarang..." className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div className="pt-2 border-t border-peach-100">
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Username Baru (Kosongkan jika tak diubah)</label>
                                        <input type="text" value={credsForm.newUsername} onChange={(e) => setCredsForm({ ...credsForm, newUsername: e.target.value })} placeholder={adminCreds.username} className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Password Baru (Kosongkan jika tak diubah)</label>
                                        <input type="password" value={credsForm.newPassword} onChange={(e) => setCredsForm({ ...credsForm, newPassword: e.target.value })} placeholder="Minimal 6 karakter" className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setShowChangeCredsModal(false)} className="w-1/2 py-2.5 bg-stone-200 hover:bg-stone-300 text-[#3D2B27] font-bold text-xs rounded-xl transition-colors">
                                            Batal
                                        </button>
                                        <button type="submit" className="w-1/2 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-xl shadow-md transition-all">
                                            Simpan Kredensial Baru
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL LOGIN ADMIN */}
                    {showLoginModal && (
                        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 cursor-pointer" onClick={() => setShowLoginModal(false)}>
                            <div className="glass-card p-5 sm:p-6 rounded-2xl sm:rounded-3xl w-[94vw] sm:w-full max-w-sm bg-white space-y-4 relative cursor-default" onClick={(e) => e.stopPropagation()}>
                                <button onClick={() => setShowLoginModal(false)} className="absolute top-4 right-4 text-[#8C7A76]">
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>
                                <div className="text-center space-y-1">
                                    <h3 className="font-serif font-bold text-xl sm:text-2xl text-[#3D2B27]">Admin Login</h3>
                                    <p className="text-xs text-[#8C7A76]">Masukan kredensial admin Anda</p>
                                </div>
                                <form onSubmit={handleLoginSubmit} className="space-y-3 pt-2">
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Username</label>
                                        <input type="text" required value={loginForm.username} onChange={(e) => setLoginForm({ ...loginForm, username: e.target.value })} placeholder="Masukkan username" className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Password</label>
                                        <input type="password" required value={loginForm.password} onChange={(e) => setLoginForm({ ...loginForm, password: e.target.value })} placeholder="Masukkan password" className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setShowLoginModal(false)} className="w-1/2 py-2.5 bg-stone-200 hover:bg-stone-300 text-[#3D2B27] font-bold text-xs rounded-xl transition-colors">
                                            Batal
                                        </button>
                                        <button type="submit" className="w-1/2 py-2.5 bg-peach-500 hover:bg-peach-600 text-white font-bold text-xs rounded-xl shadow-md transition-all">
                                            Masuk Panel Admin
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
