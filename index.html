            { id: 3, name: "GAS & Web Automation", percentage: 82 }
        ];

        function App() {
            // State Utama
            const [activeTab, setActiveTab] = React.useState('home'); 
            const [profile, setProfile] = React.useState(() => {
                const saved = localStorage.getItem('bento_profile');
                return saved ? JSON.parse(saved) : DEFAULT_PROFILE;
            });
            const [foamLinks, setFoamLinks] = React.useState(() => {
                const saved = localStorage.getItem('bento_foam_links');
                return saved ? JSON.parse(saved) : DEFAULT_FOAM_LINKS;
            });
            const [works, setWorks] = React.useState(() => {
                const saved = localStorage.getItem('bento_works');
                return saved ? JSON.parse(saved) : DEFAULT_WORKS;
            });
            const [skills, setSkills] = React.useState(() => {
                const saved = localStorage.getItem('bento_skills');
                return saved ? JSON.parse(saved) : DEFAULT_SKILLS;
            });
            const [messages, setMessages] = React.useState([]);

            // UI Filter & Player States
            const [searchQuery, setSearchQuery] = React.useState('');
            const [selectedLinkCategory, setSelectedLinkCategory] = React.useState('All');
            const [selectedWorkFilter, setSelectedWorkFilter] = React.useState('all');
            const [isPlayingAudio, setIsPlayingAudio] = React.useState(false);
            const [toastMessage, setToastMessage] = React.useState('');

            // Modals States (Semua Elemen Memiliki Modal Edit)
            const [isAdminLoggedIn, setIsAdminLoggedIn] = React.useState(false);
            const [showLoginModal, setShowLoginModal] = React.useState(false);
            const [showProfileModal, setShowProfileModal] = React.useState(false);
            const [showStatusModal, setShowStatusModal] = React.useState(false);
            const [showQuoteModal, setShowQuoteModal] = React.useState(false);
            const [showAudioModal, setShowAudioModal] = React.useState(false);
            const [showSpotlightModal, setShowSpotlightModal] = React.useState(false);
            const [showSkillsModal, setShowSkillsModal] = React.useState(false);
            const [showContactEditModal, setShowContactEditModal] = React.useState(false);
            
            const [showLinkModal, setShowLinkModal] = React.useState(false);
            const [editingLink, setEditingLink] = React.useState(null);
            
            const [showWorkModal, setShowWorkModal] = React.useState(false);
            const [editingWork, setEditingWork] = React.useState(null);
            const [activeArticleModal, setActiveArticleModal] = React.useState(null);

            // Form Temp States
            const [loginForm, setLoginForm] = React.useState({ username: '', password: '' });
            const [profileForm, setProfileForm] = React.useState(profile);
            const [statusForm, setStatusForm] = React.useState({ availableForHire: profile.availableForHire, statusTitle: profile.statusTitle, statusBadge: profile.statusBadge, statusDesc: profile.statusDesc });
            const [quoteForm, setQuoteForm] = React.useState({ quote: profile.quote, quoteSub: profile.quoteSub, author: profile.author });
            const [audioForm, setAudioForm] = React.useState({ audioTitle: profile.audioTitle, audioEp: profile.audioEp, audioCoverTag: profile.audioCoverTag });
            const [spotlightForm, setSpotlightForm] = React.useState({ spotlightBadge: profile.spotlightBadge, spotlightTitle: profile.spotlightTitle, spotlightDesc: profile.spotlightDesc });
            const [skillsListForm, setSkillsListForm] = React.useState([...skills]);
            const [contactEditForm, setContactEditForm] = React.useState({ contactTitle: profile.contactTitle, contactDesc: profile.contactDesc });
            
            const [linkForm, setLinkForm] = React.useState({ title: '', category: 'Social Media', icon: 'link', url: '', description: '', isFeatured: false });
            const [workForm, setWorkForm] = React.useState({ workType: 'image', title: '', subtitle: '', category: 'Visual Work', description: '', fullContent: '', image: '', tags: '', demoUrl: '' });
            const [contactForm, setContactForm] = React.useState({ name: '', email: '', subject: '', message: '' });

            // Simpan perubahan ke LocalStorage
            React.useEffect(() => { localStorage.setItem('bento_profile', JSON.stringify(profile)); }, [profile]);
            React.useEffect(() => { localStorage.setItem('bento_foam_links', JSON.stringify(foamLinks)); }, [foamLinks]);
            React.useEffect(() => { localStorage.setItem('bento_works', JSON.stringify(works)); }, [works]);
            React.useEffect(() => { localStorage.setItem('bento_skills', JSON.stringify(skills)); }, [skills]);

            // Sync icon rendering
            React.useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [activeTab, foamLinks, works, skills, profile, isAdminLoggedIn, selectedLinkCategory, selectedWorkFilter]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            // ---------------- HANDLERS EDITABLE SEKSIONAL ----------------
            const handleSaveProfile = (e) => {
                e.preventDefault();
                setProfile(prev => ({ ...prev, ...profileForm }));
                setShowProfileModal(false);
                showToast('👤 Profil Utama Berhasil Diperbarui!');
            };

            const handleSaveStatus = (e) => {
                e.preventDefault();
                setProfile(prev => ({ ...prev, ...statusForm }));
                setShowStatusModal(false);
                showToast('✨ Status Proyek & Availability Diperbarui!');
            };

            const handleSaveQuote = (e) => {
                e.preventDefault();
                setProfile(prev => ({ ...prev, ...quoteForm }));
                setShowQuoteModal(false);
                showToast('💬 Quote Inspiratif Diperbarui!');
            };

            const handleSaveAudio = (e) => {
                e.preventDefault();
                setProfile(prev => ({ ...prev, ...audioForm }));
                setShowAudioModal(false);
                showToast('🎙️ Audio Podcast Widget Diperbarui!');
            };

            const handleSaveSpotlight = (e) => {
                e.preventDefault();
                setProfile(prev => ({ ...prev, ...spotlightForm }));
                setShowSpotlightModal(false);
                showToast('🔥 Spotlight Bio Hub Diperbarui!');
            };

            const handleSaveSkills = (e) => {
                e.preventDefault();
                setSkills(skillsListForm);
                setShowSkillsModal(false);
                showToast('📊 List Keahlian/Skills Diperbarui!');
            };

            const handleAddSkillItem = () => {
                setSkillsListForm([...skillsListForm, { id: Date.now(), name: "Skill Baru", percentage: 80 }]);
            };

            const handleRemoveSkillItem = (id) => {
                setSkillsListForm(skillsListForm.filter(s => s.id !== id));
            };

            const handleSaveContactEdit = (e) => {
                e.preventDefault();
                setProfile(prev => ({ ...prev, ...contactEditForm }));
                setShowContactEditModal(false);
                showToast('✉️ Teks Halaman Kontak Diperbarui!');
            };

            // ---------------- HANDLERS FOAM LINK & WORKS ----------------
            const handleLinkClick = (id, url) => {
                setFoamLinks(prev => prev.map(item => item.id === id ? { ...item, clicks: item.clicks + 1 } : item));
                window.open(url, '_blank');
            };

            const handleCopyLink = (e, url) => {
                e.stopPropagation();
                navigator.clipboard.writeText(url);
                showToast('📋 Tautan berhasil disalin!');
            };

            const handleSaveLink = (e) => {
                e.preventDefault();
                if (editingLink) {
                    setFoamLinks(foamLinks.map(item => item.id === editingLink.id ? { ...linkForm, id: editingLink.id, clicks: editingLink.clicks } : item));
                    showToast('✅ Foam Link berhasil diperbarui!');
                } else {
                    const newLink = { ...linkForm, id: Date.now(), clicks: 0 };
                    setFoamLinks([newLink, ...foamLinks]);
                    showToast('✨ Foam Link baru ditambahkan!');
                }
                setShowLinkModal(false);
                setEditingLink(null);
            };

            const handleDeleteLink = (id) => {
                setFoamLinks(foamLinks.filter(item => item.id !== id));
                showToast('🗑️ Foam Link telah dihapus.');
            };

            const handleSaveWork = (e) => {
                e.preventDefault();
                const processedTags = typeof workForm.tags === 'string' ? workForm.tags.split(',').map(t => t.trim()) : workForm.tags;
                if (editingWork) {
                    setWorks(works.map(item => item.id === editingWork.id ? { ...workForm, tags: processedTags, id: editingWork.id } : item));

                    const newWork = { ...workForm, tags: processedTags, id: Date.now() };
                    setWorks([newWork, ...works]);
                    showToast('🎨 Karya baru ditambahkan!');

                setShowWorkModal(false);
                setEditingWork(null);
            };

            const handleDeleteWork = (id) => {
                setWorks(works.filter(item => item.id !== id));
                showToast('🗑️ Karya telah dihapus.');

                setContactForm({ name: '', email: '', subject: '', message: '' });
                showToast('📬 Pesan Anda berhasil dikirim ke Admin!');
            };

            // Filter Process
            const filteredLinks = foamLinks.filter(l => {
                const matchSearch = l.title.toLowerCase().includes(searchQuery.toLowerCase()) || l.description.toLowerCase().includes(searchQuery.toLowerCase());
                const matchCat = selectedLinkCategory === 'All' || l.category === selectedLinkCategory;
                return matchSearch && matchCat;
            });

            const filteredWorks = works.filter(w => {
                if (selectedWorkFilter === 'all') return true;
                return w.workType === selectedWorkFilter;
            });

                        <div className="w-8 h-[1px] bg-peach-200 my-0.5"></div>
                        <button onClick={() => setActiveTab('home')} className={`p-3 rounded-full transition-all ${activeTab === 'home' ? 'bg-peach-500 text-white shadow-md' : 'hover:bg-peach-100'}`} title="Dashboard Home">
                            <i data-lucide="layout-grid" className="w-5 h-5"></i>
                        </button>
                        <button onClick={() => setActiveTab('foam-links')} className={`p-3 rounded-full transition-all relative ${activeTab === 'foam-links' ? 'bg-peach-500 text-white shadow-md' : 'hover:bg-peach-100'}`} title="Foam Links Hub">

                            <span className="absolute top-1 right-1 w-2.5 h-2.5 bg-peach-500 border-2 border-white rounded-full"></span>
                        </button>

                            <i data-lucide="folder-git-2" className="w-5 h-5"></i>

                    <main className="flex-1 md:ml-20 flex flex-col gap-6 pb-20 md:pb-6">

                                <div className="flex items-center gap-3">
                                    <span className="text-xs font-semibold tracking-wider text-peach-600 uppercase bg-peach-100 px-3 py-1 rounded-full border border-peach-200">
                                        Personal Portfolio & Bio Hub
                                    </span>
                                    {isAdminLoggedIn && (

                                        </button>
                                    )}
                                </div>
                                <h1 className="font-serif font-bold text-3xl md:text-5xl text-[#3D2B27] mt-2 tracking-tight">
                                    {profile.greeting}
                                </h1>
                                <p className="text-xs md:text-sm text-[#8C7A76] mt-1 flex items-center gap-2">
                                    <span className="font-semibold text-[#3D2B27]">{profile.name}</span>
                                    <span>·</span>
                                    <span>{profile.role}</span>

                            </div>

                            {/* Weather Card */}
                            <div className="flex items-center gap-3 relative">
                                <div className="glass-card px-4 py-2.5 rounded-2xl flex items-center gap-3 text-xs">
                                    <div className="w-8 h-8 rounded-full bg-orange-100 text-peach-600 flex items-center justify-center">
                                        <i data-lucide="sun" className="w-4 h-4"></i>
                                    </div>
                                    <div>
                                        <div className="font-bold text-sm text-[#3D2B27]">{profile.location}</div>
                                        <div className="text-[#8C7A76] text-[11px]">{profile.weather}</div>
                                    </div>
                                </div>

                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Kategori</label>
                                        <select value={linkForm.category} onChange={(e) => setLinkForm({ ...linkForm, category: e.target.value })} className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs bg-white">
                                            <option value="Social Media">Social Media</option>
                                            <option value="Design Showcase">Design Showcase</option>
                                            <option value="Code">Code</option>
                                            <option value="Services">Services</option>
                                            <option value="Lifestyle">Lifestyle</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Ikon Lucide (misal: instagram, github, figma, link, mail, calendar)</label>
                                        <input type="text" value={linkForm.icon} onChange={(e) => setLinkForm({ ...linkForm, icon: e.target.value })} placeholder="instagram" className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">URL Target</label>
                                        <input type="url" required value={linkForm.url} onChange={(e) => setLinkForm({ ...linkForm, url: e.target.value })} placeholder="https://..." className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Deskripsi Ringkas</label>
                                        <input type="text" value={linkForm.description} onChange={(e) => setLinkForm({ ...linkForm, description: e.target.value })} placeholder="Keterangan singkat tautan..." className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div className="flex items-center gap-2 pt-1">
                                        <input type="checkbox" id="isFeatured" checked={linkForm.isFeatured} onChange={(e) => setLinkForm({ ...linkForm, isFeatured: e.target.checked })} className="rounded accent-peach-500" />
                                        <label htmlFor="isFeatured" className="text-xs font-semibold text-[#3D2B27]">Tandai Sebagai Tautan Unggulan (Featured Badge)</label>
                                    </div>
                                    <button type="submit" className="w-full py-2.5 bg-peach-500 text-white font-bold text-xs rounded-xl shadow-md">Simpan Foam Link</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL KARYA (ADD/EDIT) */}
                    {showWorkModal && (
                        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="glass-card p-6 rounded-3xl max-w-lg w-full bg-white space-y-4 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center">
                                    <h3 className="font-serif font-bold text-xl text-[#3D2B27]">{editingWork ? 'Edit Karya' : 'Tambah Karya Baru'}</h3>
                                    <button onClick={() => setShowWorkModal(false)}><i data-lucide="x" className="w-5 h-5 text-[#8C7A76]"></i></button>
                                </div>
                                <form onSubmit={handleSaveWork} className="space-y-3">
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Tipe Karya</label>
                                        <select value={workForm.workType} onChange={(e) => setWorkForm({ ...workForm, workType: e.target.value })} className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs bg-white font-semibold">
                                            <option value="image">🖼️ Visual / Gambar Showcase</option>
                                            <option value="text">📝 Artikel / Naskah Teks Utuh</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Judul Karya / Artikel</label>
                                        <input type="text" required value={workForm.title} onChange={(e) => setWorkForm({ ...workForm, title: e.target.value })} className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Sub-judul / Tagline</label>
                                        <input type="text" value={workForm.subtitle} onChange={(e) => setWorkForm({ ...workForm, subtitle: e.target.value })} className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    {workForm.workType === 'image' ? (
                                        <div>
                                            <label className="text-xs font-bold text-[#3D2B27] block mb-1">URL Gambar Preview</label>
                                            <input type="url" required value={workForm.image} onChange={(e) => setWorkForm({ ...workForm, image: e.target.value })} placeholder="https://..." className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                        </div>
                                    ) : (
                                        <div>
                                            <label className="text-xs font-bold text-[#3D2B27] block mb-1">Naskah Artikel Utuh (Teks Lengkap)</label>
                                            <textarea rows="6" required value={workForm.fullContent} onChange={(e) => setWorkForm({ ...workForm, fullContent: e.target.value })} placeholder="Tuliskan isi artikel atau esai lengkap Anda di sini..." className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs leading-relaxed"></textarea>
                                        </div>
                                    )}
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Deskripsi Singkat / Ringkasan</label>
                                        <textarea rows="2" required value={workForm.description} onChange={(e) => setWorkForm({ ...workForm, description: e.target.value })} className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs"></textarea>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Tags (pisahkan dengan koma)</label>
                                        <input type="text" value={workForm.tags} onChange={(e) => setWorkForm({ ...workForm, tags: e.target.value })} placeholder="React, UI Design, Article" className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <button type="submit" className="w-full py-2.5 bg-peach-500 text-white font-bold text-xs rounded-xl shadow-md">Simpan Karya</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL READER NASKAH ARTIKEL */}
                    {activeArticleModal && (
                        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="glass-card p-6 md:p-8 rounded-3xl max-w-2xl w-full bg-white space-y-4 max-h-[85vh] overflow-y-auto">
                                <div className="flex justify-between items-start border-b border-peach-200 pb-3">
                                    <div>
                                        <span className="text-[10px] bg-peach-100 text-peach-700 font-bold px-2.5 py-0.5 rounded-full uppercase">
                                            {activeArticleModal.category}
                                        </span>
                                        <h2 className="font-serif font-bold text-2xl text-[#3D2B27] mt-1">{activeArticleModal.title}</h2>
                                        <p className="text-xs text-peach-600 font-semibold">{activeArticleModal.subtitle}</p>
                                    </div>
                                    <button onClick={() => setActiveArticleModal(null)} className="p-1 hover:bg-peach-100 rounded-full">
                                        <i data-lucide="x" className="w-5 h-5 text-[#8C7A76]"></i>
                                    </button>
                                </div>
                                <div className="text-xs text-[#3D2B27] leading-relaxed whitespace-pre-line py-2">
                                    {activeArticleModal.fullContent || activeArticleModal.description}
                                </div>
                                <div className="pt-3 border-t border-peach-200 flex justify-between items-center text-xs">
                                    <div className="flex gap-1">
                                        {activeArticleModal.tags.map((t, i) => (
                                            <span key={i} className="bg-peach-100 text-peach-700 font-medium px-2 py-0.5 rounded-md">#{t}</span>
                                        ))}
                                    </div>
                                    <button onClick={() => setActiveArticleModal(null)} className="px-4 py-2 bg-peach-500 text-white font-bold rounded-xl">
                                        Tutup Pembaca
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL LOGIN ADMIN */}
                    {showLoginModal && (
                        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="glass-card p-6 rounded-3xl max-w-sm w-full bg-white space-y-4 relative">
                                <button onClick={() => setShowLoginModal(false)} className="absolute top-4 right-4 text-[#8C7A76]">
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>
                                <div className="text-center space-y-1">
                                    <h3 className="font-serif font-bold text-2xl text-[#3D2B27]">Admin Login</h3>
                                    <p className="text-xs text-[#8C7A76]">Kredensial default: admin / edudigital</p>
                                </div>
                                <form onSubmit={handleLoginSubmit} className="space-y-3 pt-2">
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Username</label>
                                        <input type="text" required value={loginForm.username} onChange={(e) => setLoginForm({ ...loginForm, username: e.target.value })} placeholder="admin" className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Password</label>
                                        <input type="password" required value={loginForm.password} onChange={(e) => setLoginForm({ ...loginForm, password: e.target.value })} placeholder="edudigital" className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <button type="submit" className="w-full py-2.5 bg-peach-500 text-white font-bold text-xs rounded-xl shadow-md">Masuk Panel Admin</button>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
