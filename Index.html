                                        <span className="text-[11px] font-bold tracking-wider text-peach-600 uppercase bg-peach-100 px-2.5 py-0.5 rounded-md">
                                            Featured Article
                                        </span>
                                        <h3 className="font-serif font-bold text-xl text-[#3D2B27] leading-snug">
                                            从极简主义到情感化设计, 界面正在回归真实体验
                                        </h3>
                                        <p className="text-xs text-[#8C7A76] line-clamp-2 leading-relaxed">

                                        />

                                        <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-peach-500 to-amber-700 text-white flex items-center justify-center font-bold text-xs shadow-md">
                                            Design<br/>Better

                                            <div className="font-bold text-sm text-[#3D2B27]">Design Better</div>
                                            <div className="text-xs text-[#8C7A76]">EP97 · Antarmuka Hangat</div>
                                        </div>

                                            onClick={() => setIsPlayingAudio(!isPlayingAudio)}
                                            className="ml-auto w-10 h-10 rounded-full bg-peach-500 hover:bg-peach-600 text-white flex items-center justify-center shadow-lg shadow-peach-500/30 transition-all"
                                        >
                                            <i data-lucide={isPlayingAudio ? "pause" : "play"} className="w-4 h-4 fill-white ml-0.5"></i>
                                        </button>
                                    </div>
                                    {/* Progress Bar */}
                                    <div className="w-full bg-peach-200/60 h-1.5 rounded-full overflow-hidden">
                                        <div className={`bg-peach-500 h-full transition-all duration-300 ${isPlayingAudio ? 'w-2/3 animate-pulse' : 'w-1/3'}`}></div>
                                    </div>

                                {/* 6. FOAM LINKS PREVIEW CARD (3 cols) */}

                                    <div className="flex items-center justify-between">
                                        <span className="text-xs font-semibold text-[#8C7A76] uppercase tracking-wider">快速记事 / Foam Links</span>
                                        <span className="text-[10px] bg-peach-500 text-white font-bold px-2 py-0.5 rounded-full">New</span>
                                    </div>

                                        <div className="text-xs font-bold text-[#3D2B27] flex items-center gap-2">
                                            <i data-lucide="link" className="w-3.5 h-3.5 text-peach-500"></i>
                                            <span>Social Media & Bio Hub</span>
                                        </div>
                                        <p className="text-[11px] text-[#8C7A76]">

                                        </p>
                                    </div>
                                    <button 
                                        onClick={() => setActiveTab('foam-links')}
                                        className="w-full py-2 bg-peach-500 hover:bg-peach-600 text-white text-xs font-semibold rounded-xl transition-all shadow-md shadow-peach-500/20 text-center flex items-center justify-center gap-1.5"
                                    >
                                        Buka Foam Links ({foamLinks.length}) <i data-lucide="external-link" className="w-3.5 h-3.5"></i>
                                    </button>
                                </div>

                            </div>
                        )}

                            <div className="space-y-6">

                                    <div>
                                        <span className="text-xs font-bold text-peach-600 bg-peach-100 px-3 py-1 rounded-full uppercase tracking-wider">
                                            Link In Bio & Media Sosial
                                        </span>

                                            onClick={() => setShowAddLinkModal(true)}
                                            className="px-4 py-2.5 bg-peach-500 hover:bg-peach-600 text-white text-xs font-bold rounded-2xl shadow-lg shadow-peach-500/30 flex items-center gap-2 transition-all"
                                        >
                                            <i data-lucide="plus-circle" className="w-4 h-4"></i> Tambah Foam Link
                                        </button>
                                    )}

                                {/* Filter Categories */}

                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>

                                {/* Foam Link Grid */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

                                        <div 
                                            key={link.id}
                                            onClick={() => handleLinkClick(link.id, link.url)}
                                            className="glass-card p-5 rounded-3xl flex items-center justify-between gap-4 cursor-pointer hover:scale-[1.01] transition-all group"
                                        >
                                            <div className="flex items-center gap-4">
                                                <div className="w-12 h-12 rounded-2xl bg-peach-100 text-peach-600 flex items-center justify-center group-hover:bg-peach-500 group-hover:text-white transition-all shadow-sm">
                                                    <i data-lucide={link.icon || "link"} className="w-6 h-6"></i>
                                                </div>
                                                <div>
                                                    <div className="flex items-center gap-2">
                                                        <h4 className="font-bold text-sm text-[#3D2B27] group-hover:text-peach-600 transition-colors">
                                                            {link.title}
                                                        </h4>
                                                        <span className="text-[10px] text-[#8C7A76] bg-peach-100/70 px-2 py-0.5 rounded-md">
                                                            {link.category}
                                                        </span>
                                                    </div>
                                                    <p className="text-xs text-[#8C7A76] mt-0.5">
                                                        {link.description}
                                                    </p>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <span className="text-[11px] font-medium text-[#8C7A76] bg-white/80 px-2.5 py-1 rounded-xl border border-peach-200/60">
                                                    {link.clicks} clicks
                                                </span>
                                                <div className="w-8 h-8 rounded-full bg-peach-100 text-peach-600 flex items-center justify-center group-hover:translate-x-0.5 transition-transform">
                                                    <i data-lucide="arrow-up-right" className="w-4 h-4"></i>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ----------------- TAB 3: PROJECTS SHOWCASE ----------------- */}
                        {activeTab === 'projects' && (
                            <div className="space-y-6">
                                <div className="glass-card p-6 rounded-3xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <span className="text-xs font-bold text-peach-600 bg-peach-100 px-3 py-1 rounded-full uppercase">
                                            Karya & Proyek Pilihan
                                        </span>
                                        <h2 className="font-serif font-bold text-2xl md:text-3xl text-[#3D2B27] mt-2">
                                            Portofolio Showcase 💼
                                        </h2>
                                    </div>

                                    {isAdminLoggedIn && (
                                        <button 
                                            onClick={() => setShowAddProjectModal(true)}
                                            className="px-4 py-2.5 bg-peach-500 hover:bg-peach-600 text-white text-xs font-bold rounded-2xl shadow-lg shadow-peach-500/30 flex items-center gap-2"
                                        >
                                            <i data-lucide="plus-circle" className="w-4 h-4"></i> Tambah Proyek
                                        </button>
                                    )}
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {projects.map((proj) => (
                                        <div key={proj.id} className="glass-card rounded-3xl overflow-hidden flex flex-col justify-between group">
                                            <div className="h-48 overflow-hidden relative">
                                                <img src={proj.image} alt={proj.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                                <span className="absolute top-3 left-3 bg-white/90 backdrop-blur-md text-[#3D2B27] font-bold text-[10px] px-3 py-1 rounded-full shadow-sm">
                                                    {proj.category}
                                                </span>
                                            </div>
                                            <div className="p-6 flex-1 flex flex-col justify-between">
                                                <div>
                                                    <h3 className="font-serif font-bold text-xl text-[#3D2B27] mb-1">{proj.title}</h3>
                                                    <p className="text-xs font-medium text-peach-600 mb-2">{proj.subtitle}</p>
                                                    <p className="text-xs text-[#8C7A76] leading-relaxed mb-4">{proj.description}</p>
                                                </div>
                                                <div className="pt-4 border-t border-peach-200/50 flex items-center justify-between">
                                                    <div className="flex gap-1.5">

                                                            <span key={idx} className="text-[10px] bg-peach-100 text-peach-700 font-semibold px-2 py-0.5 rounded-md">
                                                                {tag}
                                                            </span>
                                                        ))}
                                                    </div>
                                                    <a href={proj.demoUrl} target="_blank" className="text-xs font-bold text-peach-600 hover:text-peach-700 flex items-center gap-1">
                                                        Lihat Detail <i data-lucide="external-link" className="w-3.5 h-3.5"></i>
                                                    </a>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                                        <i data-lucide="mail" className="w-7 h-7"></i>
                                    </div>
                                    <h2 className="font-serif font-bold text-3xl text-[#3D2B27]">Mari Berkolaborasi ✉️</h2>

                                    </div>
                                )}

                                            <label className="text-xs font-bold text-[#3D2B27] block mb-1">Nama Lengkap</label>

                                        <div>
                                            <label className="text-xs font-bold text-[#3D2B27] block mb-1">Alamat Email</label>
                                            <input 
                                                type="email" 
                                                required 
                                                value={contactForm.email} 
                                                onChange={(e) => setContactForm({ ...contactForm, email: e.target.value })}
                                                placeholder="email@domain.com"
                                                className="w-full bg-white/80 border border-peach-200 rounded-xl px-3.5 py-2.5 text-xs text-[#3D2B27] focus:outline-none focus:border-peach-500"

                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Subjek Pesan</label>

                                            value={contactForm.subject} 
                                            onChange={(e) => setContactForm({ ...contactForm, subject: e.target.value })}

                                            className="w-full bg-white/80 border border-peach-200 rounded-xl px-3.5 py-2.5 text-xs text-[#3D2B27] focus:outline-none focus:border-peach-500" 
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Pesan / Detail Proyek</label>

                                            rows="4" 
                                            required 
                                            value={contactForm.message} 
                                            onChange={(e) => setContactForm({ ...contactForm, message: e.target.value })}

                                            className="w-full bg-white/80 border border-peach-200 rounded-xl px-3.5 py-2.5 text-xs text-[#3D2B27] focus:outline-none focus:border-peach-500"
                                        ></textarea>
                                    </div>
                                    <button 
                                        type="submit" 
                                        className="w-full py-3 bg-peach-500 hover:bg-peach-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-peach-500/30 transition-all flex items-center justify-center gap-2"
                                    >
                                        <i data-lucide="send" className="w-4 h-4"></i> Kirim Pesan Now
                                    </button>
                                </form>
                            </div>
                        )}

                                        <span className="text-xs font-bold text-emerald-600 bg-emerald-100 px-3 py-1 rounded-full uppercase">
                                            Logged in as Administrator
                                        </span>
                                        <h2 className="font-serif font-bold text-2xl text-[#3D2B27] mt-2">Admin Control Center 🔐</h2>
                                    </div>
                                    <button 
                                        onClick={() => { setIsAdminLoggedIn(false); setActiveTab('home'); }}

                                    >
                                        Logout

                                </div>

                                {/* Inbox Messages */}
                                <div className="glass-card p-6 rounded-3xl space-y-4">
                                    <h3 className="font-bold text-base text-[#3D2B27] flex items-center gap-2">
                                        <i data-lucide="inbox" className="w-4 h-4 text-peach-500"></i>
                                        Pesan Masuk ({messages.length})
                                    </h3>
                                    <div className="space-y-3">
                                        {messages.map((msg) => (
                                            <div key={msg.id} className="p-4 bg-white/80 border border-peach-200 rounded-2xl text-xs space-y-1">
                                                <div className="flex justify-between font-bold text-[#3D2B27]">
                                                    <span>{msg.name} ({msg.email})</span>
                                                    <span className="text-[#8C7A76] font-normal">{msg.date}</span>
                                                </div>
                                                <div className="text-peach-700 font-semibold">{msg.subject}</div>
                                                <p className="text-[#8C7A76]">{msg.text}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ----------------- BOTTOM QUICK PILL BAR ----------------- */}

                                onClick={() => setActiveTab('foam-links')} 
                                className="flex items-center gap-1.5 text-xs font-bold text-[#3D2B27] hover:bg-peach-100 px-3 py-1.5 rounded-full transition-colors"

                                <span className="w-2 h-2 rounded-full bg-peach-500"></span> 记一笔 / Link Hub
                            </button>
                            <span className="text-peach-300">|</span>
                            <button 
                                onClick={() => setActiveTab('projects')} 
                                className="flex items-center gap-1.5 text-xs font-bold text-[#3D2B27] hover:bg-peach-100 px-3 py-1.5 rounded-full transition-colors"
                            >
                                🔥 Portofolio
                            </button>
                            <span className="text-peach-300">|</span>
                            <button 
                                onClick={() => setActiveTab('contact')} 
                                className="flex items-center gap-1.5 text-xs font-bold text-[#3D2B27] hover:bg-peach-100 px-3 py-1.5 rounded-full transition-colors"
                            >
                                ✍️ Kirim Pesan
                            </button>
                        </div>

                    </main>

                    {/* ----------------- MODAL LOGIN ADMIN ----------------- */}
                    {showLoginModal && (
                        <div className="fixed inset-0 z-50 bg-black/30 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="glass-card p-6 md:p-8 rounded-3xl max-w-sm w-full space-y-4 bg-white relative">
                                <button onClick={() => setShowLoginModal(false)} className="absolute top-4 right-4 text-[#8C7A76]">
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>
                                <div className="text-center space-y-1">
                                    <h3 className="font-serif font-bold text-2xl text-[#3D2B27]">Admin Login</h3>
                                    <p className="text-xs text-[#8C7A76]">Masukan kredensial untuk mengelola data.</p>
                                </div>
                                <form onSubmit={handleLoginSubmit} className="space-y-3 pt-2">
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Username</label>
                                        <input 
                                            type="text" 
                                            required 
                                            value={loginForm.username} 
                                            onChange={(e) => setLoginForm({ ...loginForm, username: e.target.value })}
                                            placeholder="admin"
                                            className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" 
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Password</label>
                                        <input 
                                            type="password" 
                                            required 
                                            value={loginForm.password} 
                                            onChange={(e) => setLoginForm({ ...loginForm, password: e.target.value })}
                                            placeholder="edudigital"
                                            className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" 
                                        />
                                    </div>
                                    <button type="submit" className="w-full py-2.5 bg-peach-500 text-white font-bold text-xs rounded-xl shadow-md">
                                        Masuk Panel Admin
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ----------------- MODAL TAMBAH FOAM LINK ----------------- */}
                    {showAddLinkModal && (
                        <div className="fixed inset-0 z-50 bg-black/30 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="glass-card p-6 rounded-3xl max-w-md w-full space-y-4 bg-white relative">
                                <button onClick={() => setShowAddLinkModal(false)} className="absolute top-4 right-4 text-[#8C7A76]">
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>
                                <h3 className="font-serif font-bold text-xl text-[#3D2B27]">Tambah Foam Link Baru</h3>
                                <form onSubmit={handleAddFoamLink} className="space-y-3">
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Judul Tautan</label>
                                        <input type="text" required value={newLinkForm.title} onChange={(e) => setNewLinkForm({ ...newLinkForm, title: e.target.value })} placeholder="misal: Instagram Visual" className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Kategori</label>
                                        <select value={newLinkForm.category} onChange={(e) => setNewLinkForm({ ...newLinkForm, category: e.target.value })} className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs bg-white">
                                            <option value="Social Media">Social Media</option>
                                            <option value="Design Showcase">Design Showcase</option>
                                            <option value="Code">Code</option>
                                            <option value="Services">Services</option>
                                            <option value="Lifestyle">Lifestyle</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">URL Target</label>
                                        <input type="url" required value={newLinkForm.url} onChange={(e) => setNewLinkForm({ ...newLinkForm, url: e.target.value })} placeholder="https://..." className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-[#3D2B27] block mb-1">Deskripsi Singkat</label>
                                        <input type="text" value={newLinkForm.description} onChange={(e) => setNewLinkForm({ ...newLinkForm, description: e.target.value })} placeholder="Keterangan tautan..." className="w-full border border-peach-200 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <button type="submit" className="w-full py-2.5 bg-peach-500 text-white font-bold text-xs rounded-xl shadow-md">
                                        Simpan Foam Link
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
